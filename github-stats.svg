<svg width="800" height="280" viewBox="0 0 800 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.55" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="0" y="0" width="340" height="12" rx="6" />
    </clipPath>
  </defs>

  <style>
    .card-title { font: 700 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; }
    .metric-val { font: 800 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #f8fafc; }
    .metric-accent { font: 800 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #38bdf8; }
    .metric-emerald { font: 800 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #34d399; }
    .metric-label { font: 500 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #64748b; }
    .lang-name { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #e2e8f0; }
    .lang-pct { font: 500 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #64748b; }
    .day-label { font: 600 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #64748b; }
  </style>

  <rect width="800" height="280" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <g transform="translate(24, 24)">
    <rect width="366" height="232" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="30" class="card-title">⚡ Coding Momentum</text>

    <g transform="translate(22, 68)">
      <text x="0" y="0" class="metric-accent">847</text>
      <text x="0" y="18" class="metric-label">Contributions (1 yr)</text>
    </g>

    <g transform="translate(195, 68)">
      <text x="0" y="0" class="metric-val">13 <tspan font-size="14" font-weight="600" fill="#64748b">days</tspan></text>
      <text x="0" y="18" class="metric-label">Longest Streak (Curr: 1d)</text>
    </g>

    <line x1="22" y1="108" x2="344" y2="108" stroke="#1e293b" stroke-width="1" />

    <g transform="translate(22, 148)">
      <text x="0" y="0" class="metric-emerald">Sundays</text>
      <text x="0" y="18" class="metric-label">Most Productive Day</text>
    </g>

    <g transform="translate(180, 126)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="12" width="14" height="26" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">M</text>
      </g>
    
      <g transform="translate(24, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="18" width="14" height="20" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">T</text>
      </g>
    
      <g transform="translate(48, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="21" width="14" height="17" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">W</text>
      </g>
    
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="19" width="14" height="19" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">T</text>
      </g>
    
      <g transform="translate(96, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="26" width="14" height="12" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">F</text>
      </g>
    
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="1" width="14" height="37" rx="4" fill="#334155" />
        <text x="7" y="52" text-anchor="middle" class="day-label">S</text>
      </g>
    
      <g transform="translate(144, 0)">
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#0f172a" />
        <rect x="0" y="0" width="14" height="38" rx="4" fill="#38bdf8" />
        <text x="7" y="52" text-anchor="middle" class="day-label">S</text>
      </g>
    
    </g>
    <text x="260" y="196" text-anchor="middle" class="metric-label">Weekly Commit Rhythm</text>
  </g>

  <g transform="translate(410, 24)">
    <rect width="366" height="232" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="30" class="card-title">🛠️ Top Languages by Code Volume</text>

    <g transform="translate(13, 46)" clip-path="url(#barClip)">
      <rect width="340" height="12" fill="#0f172a" />
      <rect x="0.0" y="0" width="175.6" height="12" fill="#A97BFF" />
      <rect x="175.6" y="0" width="37.2" height="12" fill="#b07219" />
      <rect x="212.7" y="0" width="36.5" height="12" fill="#3178c6" />
      <rect x="249.3" y="0" width="35.2" height="12" fill="#f1e05a" />
      <rect x="284.5" y="0" width="34.8" height="12" fill="#ff5a03" />
      <rect x="319.2" y="0" width="20.8" height="12" fill="#f34b7d" />
    </g>

    <g transform="translate(22, 82)">
      
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="5" fill="#A97BFF" />
        <text x="18" y="10" class="lang-name">Kotlin</text>
        <text x="18" y="26" class="lang-pct">48.6%</text>
      </g>
    
      <g transform="translate(175, 0)">
        <circle cx="6" cy="6" r="5" fill="#b07219" />
        <text x="18" y="10" class="lang-name">Java</text>
        <text x="18" y="26" class="lang-pct">10.3%</text>
      </g>
    
      <g transform="translate(0, 44)">
        <circle cx="6" cy="6" r="5" fill="#3178c6" />
        <text x="18" y="10" class="lang-name">TypeScript</text>
        <text x="18" y="26" class="lang-pct">10.1%</text>
      </g>
    
      <g transform="translate(175, 44)">
        <circle cx="6" cy="6" r="5" fill="#f1e05a" />
        <text x="18" y="10" class="lang-name">JavaScript</text>
        <text x="18" y="26" class="lang-pct">9.7%</text>
      </g>
    
      <g transform="translate(0, 88)">
        <circle cx="6" cy="6" r="5" fill="#ff5a03" />
        <text x="18" y="10" class="lang-name">Astro</text>
        <text x="18" y="26" class="lang-pct">9.6%</text>
      </g>
    
      <g transform="translate(175, 88)">
        <circle cx="6" cy="6" r="5" fill="#f34b7d" />
        <text x="18" y="10" class="lang-name">C++</text>
        <text x="18" y="26" class="lang-pct">5.7%</text>
      </g>
    
    </g>
  </g>
</svg>